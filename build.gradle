subprojects {
    apply plugin: 'java-library'

    group = 'dev.doughbay'
    version = '0.1.0'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        testImplementation platform('org.junit:junit-bom:5.10.3')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    test {
        useJUnitPlatform()
        // Lets the panel preview find the client jar for real item textures.
        systemProperty 'doughbay.clientJar', System.getProperty('doughbay.clientJar', '')
        testLogging {
            events 'failed'
            exceptionFormat 'full'
        }
    }
}
