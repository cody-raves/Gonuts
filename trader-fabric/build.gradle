plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}
// Isolated GUI-to-receiver verification; excluded from production builds.
if (project.hasProperty('bugReportSmoke')) {
    sourceSets.main.java.srcDir 'src/bugReportSmoke/java'
    tasks.processResources.doLast {
        def file = destinationDir.toPath().resolve('fabric.mod.json').toFile()
        def metadata = new groovy.json.JsonSlurper().parse(file)
        metadata.entrypoints.client.add('dev.doughbay.fabric.BugReportIntegrationSmoke')
        file.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadata))
    }
    loom.runs.client {
        runDir = System.getenv('LOCALAPPDATA') + '/GoNuts/bug-report-smoke'
        if (project.hasProperty('bugReportScreenshots')) vmArg '-Dgonuts.bugReport.screenshotsOnly=true'
        programArgs '--width', '1280', '--height', '800'
    }
}
tasks.named('jar') { exclude '**/BugReportIntegrationSmoke*.class' }

version = "0.1.1-staffwatch+${project.minecraft_version}"
group = 'dev.doughbay'

base {
    archivesName = 'doughbay'
}

dependencies {
    // No `mappings` line: Minecraft 26.2 ships unobfuscated, so Loom does not
    // remap it. Yarn ended at 1.21.11 and Mojang publishes no mappings for the
    // calendar-versioned releases.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Match Minecraft's Netty version; bundle only the two additional proxy modules.
    implementation(include('io.netty:netty-codec-socks:4.2.15.Final')) { transitive = false }
    implementation(include('io.netty:netty-handler-proxy:4.2.15.Final')) { transitive = false }

    // Staff Watch preserves its original HUD/head-alert renderer.
    for (artifact in ['imgui-java-binding','imgui-java-lwjgl3','imgui-java-natives-windows','imgui-java-natives-linux','imgui-java-natives-macos']) {
        implementation(include("io.github.spair:${artifact}:1.90.0")) { exclude group: 'org.lwjgl' }
    }

    // The market engine is plain Java with no Minecraft dependency. Bundle it
    // and its runtime deps into the mod jar (jar-in-jar) so the mod is a
    // single drop-in file.
    include(implementation(project(':trader-core')))
    include(implementation(project(':trader-api')))
    include(implementation(project(':trader-storage')))
    include(implementation(project(':trader-paper')))
    include(implementation(project(':trader-engine')))
    include(implementation('com.fasterxml.jackson.core:jackson-databind:2.17.2'))
    include(implementation('com.fasterxml.jackson.core:jackson-core:2.17.2'))
    include(implementation('com.fasterxml.jackson.core:jackson-annotations:2.17.2'))
    include(implementation('org.xerial:sqlite-jdbc:3.46.1.0'))
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'loader_version', project.loader_version
    inputs.property 'loader_dependency', project.loader_dependency
    filesMatching('fabric.mod.json') {
        expand 'version': project.version,
               'minecraft_version': project.minecraft_version,
               'loader_version': project.loader_version,
               'loader_dependency': project.loader_dependency
    }
    // When this jar was built, for the update check: a release jar that is
    // not this one is an update only if it was put up after this.
    def builtAt = System.currentTimeMillis()
    inputs.property 'built_at', builtAt
    filesMatching('doughbay-build.properties') {
        expand 'built_at': builtAt
    }
    // What each build changed, carried in the jar so that what an update
    // brought can be shown without asking anyone.
    from(rootProject.file('CHANGELOG.md')) {
        rename { 'doughbay-changelog.md' }
    }
}

// Minecraft 26.2 runs on Java 25; the headless modules stay on 21.
tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Policy/config tests are pure JVM tests. Keep them enabled so malformed
// execution permissions and fee settings are exercised by every full build.

// Disposable integration verification; excluded from all normal release builds.
if (project.hasProperty('staffWatchSmoke')) {
    sourceSets.main.java.srcDir 'src/staffWatchSmoke/java'
    tasks.processResources.doLast {
        def file = destinationDir.toPath().resolve('fabric.mod.json').toFile()
        def metadata = new groovy.json.JsonSlurper().parse(file)
        metadata.entrypoints.client.add('dev.doughbay.fabric.staffwatch.IntegrationSmoke')
        file.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadata))
    }
    loom.runs.client {
        runDir = System.getenv('LOCALAPPDATA') + '/GoNuts/staffwatch-smoke'
        vmArg '-Dgonuts.staffwatch.smoke=true'
        programArgs '--width', '1920', '--height', '1080'
    }
}

